apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-az-deployment
spec:
  selector:
    matchLabels:
      app: floci-az
  template:
    metadata:
      labels:
        app: floci-az
    spec:
      containers:
        - name: floci-az
          image: floci/floci-az:latest
          ports:
            - containerPort: 4577
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
